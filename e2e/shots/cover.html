<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Here Lies cover</title>
<style>
  @font-face { font-family: "Old Standard TT"; src: url(../../docs/fonts/old-standard-tt-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Old Standard TT"; src: url(../../docs/fonts/old-standard-tt-latin-400-italic.woff2) format("woff2"); font-style: italic; }
  @font-face { font-family: "UnifrakturMaguntia"; src: url(../../docs/fonts/unifrakturmaguntia-latin-400-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .cover {
    position: relative; width: 1000px; height: 420px; overflow: hidden;
    background: #1e1828; color: #d9d3e4; font-family: "Old Standard TT", Georgia, serif;
  }
  .text { position: absolute; left: 56px; top: 56px; width: 460px; z-index: 2; }
  h1 { font-family: "UnifrakturMaguntia", serif; font-weight: 400; font-size: 108px; line-height: .9; margin: 0 0 22px; color: #e6e1d3; }
  p { margin: 0; font-size: 24px; line-height: 1.4; }
  .rule { margin-top: 22px; font-size: 19px; font-style: italic; color: #f2a20c; }
  .dots { position: absolute; left: 56px; bottom: 44px; display: flex; gap: 12px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: #f2a20c; box-shadow: inset 0 0 0 4px #c9640a; }
  .card { position: absolute; right: 150px; top: 40px; width: 290px; transform: rotate(-3deg); box-shadow: 0 24px 50px -20px rgba(0,0,0,.8); z-index: 1; }
  .card img { display: block; width: 100%; }
  .card2 { position: absolute; right: -10px; top: 96px; width: 240px; transform: rotate(5deg); box-shadow: 0 24px 50px -20px rgba(0,0,0,.8); }
  .card2 img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="text">
    <h1>Here Lies</h1>
    <p>Obituaries for the things that died in your house, written by a model on your own laptop.</p>
    <p class="rule">It may invent a name. It may not invent a scratch.</p>
  </div>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="card2"><img id="second" alt=""></div>
  <div class="card"><img id="first" alt=""></div>
</div>
</body>
</html>
